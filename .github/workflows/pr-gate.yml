# Wait mode for now, not watch mode. Watch mode's workflow_run trigger only
# fires for a workflow file that already exists on the default branch (the
# pr-gate action's own README: "Fires only once this file is on the default
# branch, so merge it before requiring gate"). This PR is what introduces
# the file, so on this branch workflow_run can never fire -- confirmed live:
# the one pull_request-triggered watch run took a snapshot while other jobs
# were still in progress, published `gate: pending`, and had no way to ever
# recompute, permanently blocking this PR.
#
# Wait mode needs nothing merged first: one job blocks until every other job
# on the commit finishes, then passes or fails with them -- same mechanism
# the old kachick/wait-other-jobs setup used, same author's action. Once
# this merges to main, a follow-up PR can switch to watch mode (copy the
# couture-cast config verbatim) so future feature branches get the
# seconds-per-event version instead of holding a runner for the whole build.
name: PR Gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: muratkeremozcan/pr-gate@main
        with:
          mode: wait
