# Provider Verification via PactFlow Webhook
#
# This workflow runs in the PROVIDER repo.
# PactFlow fires a webhook when a consumer publishes a new pact,
# triggering this workflow via GitHub repository_dispatch.
#
# Setup in PactFlow:
#   1. Go to Settings > Webhooks
#   2. Create webhook with event: "contract_requiring_verification_published"
#   3. Set URL: https://api.github.com/repos/{owner}/{repo}/dispatches
#   4. Set headers: Authorization: token <GITHUB_PAT>
#   5. Set body: { "event_type": "contract_requiring_verification_published",
#                  "client_payload": { "pact_url": "${pactbroker.pactUrl}",
#                                      "sha": "${pactbroker.providerVersionNumber}",
#                                      "branch": "${pactbroker.providerVersionBranch}" } }
#
# Copy this to your provider repo.

name: Pact webhook provider verification

on:
  repository_dispatch:
    types:
      - contract_requiring_verification_published

env:
  PACT_BROKER_BASE_URL: ${{ secrets.PACT_BROKER_BASE_URL }}
  PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
  PACT_PAYLOAD_URL: ${{ github.event.client_payload.pact_url }}
  PACT_PROVIDER_VERSION: ${{ github.event.client_payload.sha }}
  PACT_PROVIDER_BRANCH: ${{ github.event.client_payload.branch }}

jobs:
  provider-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Extract consumer branch from Pact Broker to detect breaking changes
      - name: Extract consumer branch and detect breaking change
        id: pact-info
        env:
          PACT_URL: ${{ github.event.client_payload.pact_url }}
          BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
        run: |
          # Fetch the pact to get consumer version link
          PACT_JSON=$(curl -s -H "Authorization: Bearer $BROKER_TOKEN" "$PACT_URL")
          CONSUMER_VERSION_URL=$(echo "$PACT_JSON" | jq -r '._links."pb:consumer-version".href // empty')

          if [ -n "$CONSUMER_VERSION_URL" ]; then
            VERSION_JSON=$(curl -s -H "Authorization: Bearer $BROKER_TOKEN" "$CONSUMER_VERSION_URL")
            CONSUMER_BRANCH=$(echo "$VERSION_JSON" | jq -r '._embedded.branchVersions[0].name // "main"')
          else
            CONSUMER_BRANCH="main"
          fi

          echo "consumer_branch=$CONSUMER_BRANCH" >> "$GITHUB_OUTPUT"

          # If consumer branch contains "breaking", set PACT_BREAKING_CHANGE
          if echo "$CONSUMER_BRANCH" | grep -iq "breaking" && [ "$CONSUMER_BRANCH" != "main" ]; then
            echo "PACT_BREAKING_CHANGE=true" >> "$GITHUB_ENV"
          else
            echo "PACT_BREAKING_CHANGE=false" >> "$GITHUB_ENV"
          fi

      # Checkout strategy (in priority order):
      #   1. Consumer branch name exists on provider: coordinated breaking-change workflow
      #   2. PACT_PROVIDER_BRANCH (${pactbroker.providerVersionBranch}): provider's last
      #      registered branch in PactFlow, e.g. release/week-32. Skipped if that exact
      #      commit no longer exists on the branch (force-push, history rewrite).
      #   3. main: absolute fallback
      #
      # The selected commit becomes PACT_PROVIDER_VERSION (not the PactFlow-requested
      # client_payload.sha), so verification results are published against the code
      # that actually ran. Trade-off: when this falls through to main, PactFlow's
      # originally-requested provider version never receives a result and the webhook
      # event keeps re-firing for it; the consumer's can-i-deploy against that specific
      # version stays unknown rather than passing or failing outright.
      #
      # The resolved version/branch are exported both via $GITHUB_ENV (for steps that
      # read process.env directly, e.g. getProviderVersionTags and the pacttest files'
      # breaking-change gate) and as step outputs (for the verification steps below,
      # which take them explicitly to avoid relying on $GITHUB_ENV step-ordering).
      - name: Checkout provider branch
        id: checkout-provider
        env:
          CONSUMER_BRANCH: ${{ steps.pact-info.outputs.consumer_branch }}
        run: |
          if git ls-remote --exit-code --heads origin "refs/heads/$CONSUMER_BRANCH" >/dev/null; then
            echo "Checking out consumer-matching provider branch: $CONSUMER_BRANCH"
            git checkout "$CONSUMER_BRANCH"
            SELECTED_PROVIDER_BRANCH="$CONSUMER_BRANCH"
          elif [ -n "$PACT_PROVIDER_BRANCH" ] && [ -n "$PACT_PROVIDER_VERSION" ] && [ "$PACT_PROVIDER_BRANCH" != "main" ] && [ "$PACT_PROVIDER_BRANCH" != "master" ] && git ls-remote --exit-code --heads origin "refs/heads/$PACT_PROVIDER_BRANCH" >/dev/null && git rev-parse --verify --quiet "$PACT_PROVIDER_VERSION^{commit}" >/dev/null; then
            echo "Checking out provider version $PACT_PROVIDER_VERSION from PactFlow branch: $PACT_PROVIDER_BRANCH"
            git checkout --detach "$PACT_PROVIDER_VERSION"
            SELECTED_PROVIDER_BRANCH="$PACT_PROVIDER_BRANCH"
          else
            echo "No matching branch found, falling back to main"
            git checkout main
            SELECTED_PROVIDER_BRANCH="main"
          fi

          SELECTED_PROVIDER_VERSION="$(git rev-parse HEAD)"

          echo "PACT_PROVIDER_VERSION=$SELECTED_PROVIDER_VERSION" >> "$GITHUB_ENV"
          echo "PACT_PROVIDER_BRANCH=$SELECTED_PROVIDER_BRANCH" >> "$GITHUB_ENV"
          echo "GITHUB_BRANCH=$SELECTED_PROVIDER_BRANCH" >> "$GITHUB_ENV"
          echo "version=$SELECTED_PROVIDER_VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$SELECTED_PROVIDER_BRANCH" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma types
        run: cd sample-app/backend && npx prisma generate

      # Both verifications always run regardless of each other's outcome - this
      # workflow used to stop at the first failure, but that meant a provider with
      # both a broken HTTP contract and a broken message contract only ever surfaced
      # one of the two per run. Each still reports and fails independently below.
      - name: Run provider HTTP contract verification
        id: provider-verify-http
        continue-on-error: true
        run: npm run test:pact:provider:remote:contract
        env:
          PACT_BREAKING_CHANGE: ${{ env.PACT_BREAKING_CHANGE }}
          PACT_PROVIDER_VERSION: ${{ steps.checkout-provider.outputs.version }}
          PACT_PROVIDER_BRANCH: ${{ steps.checkout-provider.outputs.branch }}
          GITHUB_BRANCH: ${{ steps.checkout-provider.outputs.branch }}

      - name: Run provider message queue verification
        id: provider-verify-message
        continue-on-error: true
        run: npm run test:pact:provider:remote:message
        env:
          PACT_BREAKING_CHANGE: ${{ env.PACT_BREAKING_CHANGE }}
          PACT_PROVIDER_VERSION: ${{ steps.checkout-provider.outputs.version }}
          PACT_PROVIDER_BRANCH: ${{ steps.checkout-provider.outputs.branch }}
          GITHUB_BRANCH: ${{ steps.checkout-provider.outputs.branch }}

      - name: Pact report and comment (HTTP)
        if: always()
        uses: ./.github/actions/pact-report-comment
        with:
          artifacts-path: pacts/
          report-name: pact-webhook-provider-http-${{ github.event.client_payload.sha || github.sha }}
          test-outcome: ${{ steps.provider-verify-http.outcome }}
          check-label: 'Provider HTTP contract verification (webhook)'
          pacticipant: SampleMoviesAPI
          broker-base-url: ${{ env.PACT_BROKER_BASE_URL }}
          comment-on-pr: 'false'

      - name: Pact report and comment (message)
        if: always()
        uses: ./.github/actions/pact-report-comment
        with:
          artifacts-path: pacts/
          report-name: pact-webhook-provider-message-${{ github.event.client_payload.sha || github.sha }}
          test-outcome: ${{ steps.provider-verify-message.outcome }}
          check-label: 'Provider message queue verification (webhook)'
          pacticipant: SampleMoviesAPI-event-producer
          broker-base-url: ${{ env.PACT_BROKER_BASE_URL }}
          comment-on-pr: 'false'

      - name: Fail if provider verification failed
        if: steps.provider-verify-http.outcome == 'failure' || steps.provider-verify-message.outcome == 'failure'
        run: exit 1
